# FACET — runs the app and PostgreSQL on the company Windows PC.
# restart: always plus "start Docker Desktop on boot" is what makes the machine
# come back unattended after a power cut (docs/03-stack.md).

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to loopback on purpose. Postgres is never reachable from the LAN
      # or through the Cloudflare Tunnel — only the app container and local
      # tools connect. Do not change this to "5432:5432".
      - "127.0.0.1:5432:5432"
    volumes:
      - facet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is "db", not localhost. This is
      # set here so DATABASE_URL in .env can stay pointed at localhost for
      # host-side `npm run dev` and drizzle-kit.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  facet-db-data:
